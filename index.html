        // Project paths are compared case-insensitively.

            "/nexus-store",
            "/chat",
            "/chat-space",
            "/parkour",
            "/nexus-ai",
            "/chs-social"

        function isAuthorized() {
            const host = window.location.hostname.toLowerCase();

            // Normalize the path without relying on an escaped regex.
            let path = window.location.pathname.toLowerCase();

            while (path.length > 1 && path.endsWith("/")) {
                path = path.slice(0, -1);
            }

            const isApprovedGitHubPage =
                host === "bex-creator.github.io" &&
                allowedProjects.some(function (project) {
                    return path === project ||
                           path.startsWith(project + "/");
                });

            const isLocalDevelopment =
                host === "localhost" ||
                host === "127.0.0.1";

            return isApprovedGitHubPage || isLocalDevelopment;
        }

        function decodeBase64Unicode(encoded) {
            const binary = atob(encoded);

            const bytes = Uint8Array.from(
                binary,
                function (character) {
                    return character.charCodeAt(0);
                }
            );

            return new TextDecoder().decode(bytes);
        }

            const data = decodeBase64Unicode(encodedString);

            for (let i = 0; i < data.length; i += 50) {
                yield data.slice(i, i + 50);

        }
